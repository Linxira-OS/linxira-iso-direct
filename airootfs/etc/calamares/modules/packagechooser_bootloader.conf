---
mode: required
method: legacy
labels:
  step: "系统引导"
  step[en]: "System Boot"
default: grub
items:
  - id: grub
    name: "GRUB"
    description: "默认引导器 · 兼容性最好。支持 UEFI 与 BIOS，可自动检测 Windows 与其他 Linux（os-prober），支持安全启动（shim）。ESP 只需 512MB，Windows 双系统的 100MB ESP 也能容纳。安装后的启动菜单使用 Linxira OS 品牌，提供 linux 与 linux-lts 双内核入口，可在菜单中手动选择内核版本（含安全模式 / 旧内核）。适合 Windows 双系统与绝大多数主板。"
    description[en]: "Default bootloader · best compatibility. Supports UEFI and BIOS, auto-detects Windows and other Linux systems (os-prober), and supports Secure Boot (shim). Needs only a 512MB ESP, so even a 100MB Windows ESP works for dual-boot. The installed menu uses Linxira branding, exposes both linux and linux-lts entries, and lets you pick a kernel version (including a safe/lts mode). Best for Windows dual-boot and virtually any motherboard."
  - id: systemd-boot
    name: "systemd-boot"
    description: "极简现代 · 快速可靠。systemd 家族的极简引导器，启动快、配置简单、故障少。对部分 MSI 主板 UEFI 兼容性问题的机器是最可靠的回退方案。注意：内核与 initramfs 直接放入 ESP，需要至少 1GB 的 ESP；仅支持 UEFI；Windows 双启动需手动添加条目。"
    description[en]: "Minimal & modern · fast and reliable. From the systemd family, boots quickly with a simple config and few failure modes; the most reliable fallback for MSI motherboards with UEFI issues. Note: kernels live directly in the ESP (needs ≥1GB); UEFI only; Windows dual-boot needs manual entries."
  - id: refind
    name: "rEFInd"
    description: "现代化图形 · 毛玻璃美观。自动扫描并列出本机所有操作系统与内核（含 Linux、Windows、macOS），支持图形化内核版本选择与毛玻璃主题定制，界面最精致。适合多系统用户和追求美观启动界面的用户。注意：内核直接放入 ESP，需要至少 1GB 的 ESP；仅支持 UEFI。"
    description[en]: "Modern graphical · frosted-glass beauty. Auto-detects every OS and kernel on the machine (Linux, Windows, macOS), offers graphical kernel-version selection and polished glassmorphism themes — the most refined boot screen. Ideal for multi-boot and users who want a beautiful boot menu. Note: kernels live directly in the ESP (needs ≥1GB); UEFI only."
