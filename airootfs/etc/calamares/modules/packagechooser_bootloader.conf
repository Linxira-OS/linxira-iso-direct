---
mode: required
method: legacy
labels:
  step: "系统引导"
  step[en]: "System Boot"
default: grub
items:
  - id: grub
    name: "GRUB"
    description: "默认引导器，兼容性最好。支持 UEFI 与 BIOS，可自动检测 Windows 与其他 Linux（os-prober），支持安全启动（shim）。ESP 只需 512MB，Windows 双系统的 100MB ESP 也能容纳。安装后的启动菜单使用 Linxira OS 品牌，提供 linux 与 linux-lts 双内核入口。"
    description[en]: "Default bootloader with the best compatibility. Supports UEFI and BIOS, auto-detects Windows and other Linux systems (os-prober), and supports Secure Boot (shim). Needs only a 512MB ESP, so even a 100MB Windows ESP works for dual-boot. The installed menu uses Linxira branding with linux and linux-lts entries."
  - id: systemd-boot
    name: "systemd-boot"
    description: "systemd 家族的极简引导器，简单、快速、可靠。适合不追求高级功能的用户；对部分 MSI 主板 UEFI 兼容性问题的机器是最可靠的回退方案。注意：内核与 initramfs 直接放入 ESP，需要至少 1GB 的 ESP；仅支持 UEFI；Windows 双启动需手动配置。"
    description[en]: "A minimal, fast and reliable bootloader from the systemd family. Great if you prefer the simplest setup and don't need advanced features; also the most reliable fallback for MSI motherboards with UEFI issues. Note: kernels live directly in the ESP (needs ≥1GB); UEFI only; Windows dual-boot requires manual entries."
  - id: refind
    name: "rEFInd"
    description: "图形化引导管理器，自动扫描并列出本机所有操作系统（Linux、Windows、macOS），界面美观、可定制主题。适合多系统用户和追求美观启动界面的用户。注意：内核直接放入 ESP，需要至少 1GB 的 ESP；仅支持 UEFI。"
    description[en]: "A graphical boot manager that auto-detects every OS on the machine (Linux, Windows, macOS) with a polished, themeable interface. Ideal for multi-boot setups and users who want a beautiful boot screen. Note: kernels live directly in the ESP (needs ≥1GB); UEFI only."
