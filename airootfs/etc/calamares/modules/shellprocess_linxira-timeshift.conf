#
# 安装末段（bootloader 生成 grub.cfg 之后）：
# 应用 timeshift 配置 + 事务前快照钩子 + grub-btrfsd --timeshift-auto + 初始快照 + 重生成 grub.cfg。
# 脚本由 linxiraboot 模块预先复制到目标系统, 与 linxira-config timeshift enable 共用, 幂等。
# 前缀 "-" 表示失败不阻塞安装 (grub-btrfsd 首次触发时也会补生成快照菜单)。
---
dontChroot: false
timeout: 600
script:
    - command: "-/usr/share/linxira/timeshift/linxira-timeshift-enable.sh"
i18n:
    name: "Applying Timeshift snapshots and GRUB snapshot menu"
