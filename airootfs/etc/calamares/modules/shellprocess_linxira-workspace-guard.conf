# SPDX-License-Identifier: CC0-1.0
#
# 安装末段: 在非系统盘上建立工作区守护的 ext4 分区与配置, 再由
# linxira-config workspace-guard adopt-installer 建仓库、注册工作区、开启定时器。
# 守护分区不写进 /etc/fstab —— 开机不挂载, 没有 root 就够不着快照。
# 前缀 "-" 表示失败不阻塞安装: 没有第二块盘时守护保持关闭, 装机器照常完成。
---
dontChroot: false
timeout: 600
script:
    - command: "-/usr/share/linxira/workspace-guard/linxira-workspace-guard-install.sh"
i18n:
    name: "Setting up workspace guard recovery points"
