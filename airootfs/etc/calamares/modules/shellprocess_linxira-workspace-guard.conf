#
# 安装末段: 在系统盘建立工作区守护的 root-only 目录与配置, 再由
# linxira-config workspace-guard adopt-installer 建仓库、注册工作区、开启定时器。
# 不建分区, 不改分区表, 不写 /etc/fstab。
# 前缀 "-" 表示失败不阻塞安装: 守护建不出来时保持关闭, 装机器照常完成。
---
dontChroot: false
timeout: 600
script:
    - command: "-/bin/bash /usr/share/linxira/workspace-guard/linxira-workspace-guard-install.sh"
i18n:
    name: "Setting up workspace guard recovery points"
