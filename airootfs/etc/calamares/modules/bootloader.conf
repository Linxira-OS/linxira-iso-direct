---
# 引导器选择暂时关闭: 固定 GRUB。systemd-boot/rEFInd + 快照菜单
# 待多桌面/多引导方案一起研究后再开放, 避免早期安装路径分叉。
efiBootLoader: grub
kernelSearchPath: /usr/lib/modules
kernelPattern: "^vmlinuz.*"
kernelParams: [ quiet, splash ]
# systemd-boot loader entries (appended to loader.conf)
loaderEntries:
  - "timeout 5"
  - "console-mode keep"
# kernels rEFInd should accept (linux + linux-lts 双内核)
refindKernelList: [ "linux", "linux-lts" ]
# GRUB 2 binary names and boot directory
grubInstall: grub-install
grubMkconfig: grub-mkconfig
grubCfg: /boot/grub/grub.cfg
grubProbe: grub-probe
efiBootMgr: efibootmgr
efiBootloaderId: linxira
# 2026-10-26: 不写 \EFI\BOOT\BOOTX64.EFI —— 共用 Windows ESP 时它会覆盖通用
# 回退文件, 而部分笔记本固件在 NVRAM 丢失时正靠它回退。NVRAM 条目已足够;
# 独立盘场景如需回退, 用户可手动复制。
installEFIFallback: false
installHybridGRUB: false
