#
# 安装末段（bootloader 生成 grub.cfg 之后）：UEFI 安装把 saved_entry 放在
# ESP，grub-install 仍会在 btrfs /boot/grub 生成空的 grubenv；GRUB 加载它
# 会报 "sparse file not allowed"。这里在首启前删掉 btrfs 副本，保留 ESP 块。
# BIOS 安装没有 ESP，脚本直接跳过。
---
dontChroot: false
timeout: 60
script:
    - command: "-/bin/sh /usr/share/linxira/grub/linxira-grub-env.sh"
i18n:
    name: "Removing the btrfs GRUB environment block"
