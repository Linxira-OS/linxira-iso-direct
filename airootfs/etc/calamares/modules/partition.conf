---
efi:
  mountPoint: /boot/efi
  recommendedSize: 1024MiB
  minimumSize: 512MiB
  label: EFI
userSwapChoices: [ none ]
# 2026-09-29: erase 预选回退为 none —— r12 实测 calamares 启动即
# SIGABRT(134), 唯一启动路径增量就是 erase 预选; 解耦变量, 重试
# 靠启动清场解决(手动分区本就禁用, 页面上点擦盘即可)。
# 2026-10-26: 默认预选「与 Windows 共存」, 避免小白把第一个可选项(擦除磁盘)
# 当成默认而抹掉 Windows。无其他系统时 Calamares 会回落到手动选择。
initialPartitioningChoice: alongside
initialSwapChoice: none
defaultPartitionTableType: gpt
requiredPartitionTableType: gpt
defaultFileSystemType: btrfs
availableFileSystemTypes: [ btrfs ]
luksGeneration: luks2
# 2026-10-26: 开放手动分区给高级用户; 安全性由安装前门禁兜底
# (ESP 容量、可移动盘、Linux 侧不推荐拆分过多分区)。
allowManualPartitioning: true
enableLuksAutomatedPartitioning: false
lvm:
  enable: false
essentialMounts: [ "live-*", control, ventoy ]
requiredStorage: 24
# 2026-09-28 事故修复: 移除 bootloaderOverrides。这是 CachyOS calamares fork 的
# 键 —— Arch 官方 calamares(我们用的)里 partition/bootloader 模块都不认识它,
# 属于死配置。真实行为: ESP 恒按上方 efi 段挂载在 /boot/efi(1024MiB),
# 与引导器选择无关。此前误以为选 rEFInd/systemd-boot 时 ESP 会挂到 /boot,
# 而校验器按 /boot/EFI/refind/refind.conf 找文件, 装机在收尾校验必然失败
# (实测: rEFInd 安装报 missing file: /boot/EFI/refind/refind.conf)。
# 上游 bootloader 模块(v3.3.14)对三种引导的真实落点见
# modules/linxiravalidate/main.py 的 BOOTLOADER_PATHS。

