---
efi:
  mountPoint: /boot/efi
  recommendedSize: 1024MiB
  minimumSize: 512MiB
  label: EFI
userSwapChoices: [ none ]
initialPartitioningChoice: none
initialSwapChoice: none
defaultPartitionTableType: gpt
requiredPartitionTableType: gpt
defaultFileSystemType: btrfs
availableFileSystemTypes: [ btrfs ]
luksGeneration: luks2
allowManualPartitioning: false
enableLuksAutomatedPartitioning: false
lvm:
  enable: false
essentialMounts: [ "live-*", control, ventoy ]
requiredStorage: 24
# 引导程序驱动分区策略（对标 CachyOS bootloaderOverrides）：
#  - grub: 内核在 /boot(btrfs)，ESP 只放引导器 → 512M
#  - systemd-boot/refind: 内核直接进 ESP → 1G
#  - limine: 内核进 ESP + 快照 → 4G
bootloaderOverrides:
  - name: grub
    efi:
      mountPoint: /boot/efi
      recommendedSize: 512MiB
      minimumSize: 512MiB
  - name: systemd-boot
    efi:
      mountPoint: /boot
      recommendedSize: 1024MiB
      minimumSize: 512MiB
  - name: refind
    efi:
      mountPoint: /boot
      recommendedSize: 1024MiB
      minimumSize: 512MiB
  - name: limine
    efi:
      mountPoint: /boot
      recommendedSize: 4096MiB
      minimumSize: 1024MiB

