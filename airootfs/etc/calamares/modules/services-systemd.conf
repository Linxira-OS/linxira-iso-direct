---
# 2026-09-21: sddm/cronie 降为非强制 —— 服务器与「纯 Arch 最小安装」基线不含
# 这两个包, mandatory:true 会让安装在该步直接失败; 桌面路径的 sddm 缺失
# 由 linxiravalidate 的 display-manager/state.conf 校验兜底, 不会静默坏。
units:
  - name: NetworkManager.service
    action: enable
    mandatory: true
  - name: sddm.service
    action: enable
    mandatory: false
  - name: cronie.service
    action: enable
    mandatory: false
  - name: grub-btrfsd.service
    action: enable
    mandatory: false
