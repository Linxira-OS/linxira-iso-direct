---
# 分区之前清理上一次失败安装的现场(目标挂载点占用/swap/LVM/RAID/LUKS)。
# dontChroot: true —— 必须跑在 live 宿主环境, 清理的正是宿主的挂载表。
# 前缀 "-" 表示失败不阻塞安装: 没有可清的现场时照常继续。
# (2026-09-29 教训: 本文件的键是 script/dontChroot —— 此前误用 module.desc
#  风格的 type/name/interface/command/chroot, 模块加载即抛异常,
#  calamares 启动直接 SIGABRT(134), 表现为点安装就只剩全屏诊断终端。)
---
dontChroot: true
timeout: 120
script:
    - command: "-/usr/local/bin/linxira-install-cleanup"
i18n:
    name: "Cleaning up any previous failed install session"
