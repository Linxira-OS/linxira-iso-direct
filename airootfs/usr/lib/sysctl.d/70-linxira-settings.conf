# Linxira OS memory & performance tuning (照搬 CachyOS 已验证参数)
# 桌面超算定位: 保留常规功能, 均衡优化内存/IO/安全

# 内存紧张时倾向用 zram swap (IO 成本与内存相当)
vm.swappiness = 100

# 减少 VFS 缓存回收倾向 (目录/inode 缓存), 提升文件操作响应
vm.vfs_cache_pressure = 50

# 脏页写回阈值 (字节), 避免突发大量写盘
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500

# swap 预读关闭 (配合 zram, zram 无需磁盘预读)
vm.page-cluster = 0

# 禁用 NMI watchdog: 加快启停 + 降功耗
kernel.nmi_watchdog = 0

# 允许普通用户运行非特权容器 (podman/distrobox 依赖)
kernel.unprivileged_userns_clone = 1

# 隐藏内核控制台消息, 减少日志干扰
kernel.printk = 3 3 3 3

# 限制 /proc 内核指针访问 (安全)
kernel.kptr_restrict = 2

# 网络接收队列加大, 减少丢包
net.core.netdev_max_backlog = 4096

# 文件句柄/缓存上限 (容器与科学计算场景)
fs.file-max = 2097152
