name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: linxira-iso-direct
      - uses: actions/checkout@v4
        with:
          repository: Linxira-OS/linxira-catalog
          path: linxira-catalog
      - uses: actions/checkout@v4
        with:
          repository: Linxira-OS/linxira-package-center
          path: linxira-package-center
      - uses: actions/checkout@v4
        with:
          repository: Linxira-OS/linxira-component-manager
          path: linxira-component-manager
      - uses: actions/checkout@v4
        with:
          repository: Linxira-OS/linxira-config-hub
          path: linxira-config-hub
      - uses: actions/checkout@v4
        with:
          repository: Linxira-OS/linxira-welcome
          path: linxira-welcome
      - uses: actions/checkout@v4
        with:
          repository: Linxira-OS/linxira-artwork
          path: linxira-artwork
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - working-directory: linxira-iso-direct
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - working-directory: linxira-iso-direct
        run: python -m compileall -q src
